<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><script>/* Blefe fora do Claude: liga o jogo a /api/db (Vercel + Upstash Redis, ou servidor.py na rede local).
   Imita a interface claude.use("db") / claude.use("user") que o jogo já usa. */
(function () {
  var slot = new URLSearchParams(location.search).get("p") || "";
  var uid = null;
  try { uid = localStorage.getItem("blefe.uid" + slot); } catch (e) {}
  if (!uid) {
    uid = "u_" + Math.random().toString(36).slice(2, 12) + Math.random().toString(36).slice(2, 10);
    try { localStorage.setItem("blefe.uid" + slot, uid); } catch (e) {}
  }
  if (slot) { // ?p=1, ?p=2: vários jogadores no mesmo navegador, para testar
    try {
      var keys = { "blefe.mesa": 1, "blefe.nick": 1 }, P = Storage.prototype, g = P.getItem, s = P.setItem, r = P.removeItem;
      P.getItem = function (k) { return g.call(this, keys[k] ? k + slot : k); };
      P.setItem = function (k, v) { return s.call(this, keys[k] ? k + slot : k, v); };
      P.removeItem = function (k) { return r.call(this, keys[k] ? k + slot : k); };
    } catch (e) {}
  }
  var POLL_MS = 1000;
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  function call(op, body) {
    return fetch("/api/db?op=" + op, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body), cache: "no-store" })
      .then(function (r) { return r.json().catch(function () { return { error: "unavailable" }; }); },
            function () { return { error: "unavailable" }; })
      .then(function (j) { if (j && j.error) { if (j.message) console.warn("[blefe]", j.message); throw { code: j.error, message: j.message || j.error }; } return j; });
  }
  function snap(path, r) {
    var d = r.data;
    return { id: path.split("/").pop(), exists: !!d, data: function () { return d ? JSON.parse(JSON.stringify(d)) : undefined; }, metadata: { fromCache: false, hasPendingWrites: false } };
  }
  function ref(path) {
    return {
      path: path, id: path.split("/").pop(),
      get: function () { return call("get", { path: path }).then(function (r) { return snap(path, r); }); },
      set: function (d) { return call("set", { path: path, data: d }).then(function () {}); },
      update: function (d) { return call("update", { path: path, data: d }).then(function () {}); },
      delete: function () { return call("delete", { path: path }).then(function () {}); },
      acquire: function (o) { return call("acquire", { path: path, holder: o.holder, ttlMs: o.ttlMs || 30000 }); },
      onSnapshot: function (next) {
        var stop = false, v = -1, kick = null;
        function wait(ms) { return new Promise(function (res) { var t = setTimeout(res, ms); kick = function () { clearTimeout(t); res(); }; }); }
        (async function loop() {
          while (!stop) {

              var r = await call("watch", { path: path, since: v });

        window.addEventListener("blefe:wrote", function () { if (kick) kick(); });
        return function () { stop = true; if (kick) kick(); };
      }
    };
  }
  var db = {
    doc: function (p) {
      var r0 = ref(p), set0 = r0.set, upd0 = r0.update;

<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: uma coluna de mesa (máx. 480px). Mesa → palco do lance → sua mão → ações → histórico. Escuro por escolha (marca Impulso). */
:root {
  --bg: #0E1A26; --bg-2: #142434; --surf: #1B2F42; --surf-2: #233B53;
  --line: rgba(232,239,245,.09); --line-2: rgba(232,239,245,.17);
  --fg: #E8EFF5; --mute: rgba(232,239,245,.64); --faint: rgba(232,239,245,.40);

  --display: "Marcellus", "Cinzel", "Trajan Pro", Georgia, serif;
  --body: "Jost", "Avenir Next", ui-sans-serif, system-ui, sans-serif;
  --ease: cubic-bezier(.2,.7,.2,1); --ease-io: cubic-bezier(.65,0,.35,1); --spring: cubic-bezier(.34,1.4,.5,1);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; min-height: 100%; overflow-x: hidden; }
.atmo { position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(130% 55% at 50% -12%, #22405C 0%, rgba(20,36,52,0) 62%),
              radial-gradient(90% 40% at 50% 112%, rgba(200,176,120,.07), transparent 70%), var(--bg); }
.atmo img { position: absolute; width: 150vw; max-width: 900px; left: 50%; top: 34%; transform: translate(-50%,-50%); opacity: .025; }
#app { position: relative; z-index: 1; }
.wrap { max-width: 480px; margin: 0 auto; padding-block: 18px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 1.5px solid var(--gold); outline-offset: 3px; }
button:disabled { cursor: default; }
.eyebrow { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); font-weight: 500; }
.display { font-family: var(--display); font-weight: 400; letter-spacing: .04em; text-wrap: balance; }
.mute { color: var(--mute); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- botões ---------- */
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 20px; border-radius: 14px;
  font-weight: 500; letter-spacing: .02em; font-size: 15.5px; transition: transform .18s var(--ease), background .25s ease, border-color .25s ease, opacity .25s ease; width: 100%; }
.btn:active:not(:disabled) { transform: scale(.975); }
.btn-primary { background: var(--fg); color: #0E1A26; box-shadow: 0 10px 30px -14px rgba(232,239,245,.55); }
.btn-ghost { border: 1px solid var(--line-2); color: var(--fg); background: rgba(232,239,245,.03); }
.btn-ghost:hover:not(:disabled) { border-color: rgba(232,239,245,.32); }
.btn-bad { border: 1px solid color-mix(in srgb, var(--bad) 60%, transparent); color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, transparent); }
.btn-role { border: 1px solid color-mix(in srgb, var(--rc) 55%, transparent); color: var(--fg); background: color-mix(in srgb, var(--rc) 9%, transparent); }
.btn-role .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rc); box-shadow: 0 0 10px var(--rc); }
.btn:disabled { opacity: .38; }
.btn-text { color: var(--mute); font-size: 14px; padding: 10px; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--line-2); }
.btn-row { display: grid; gap: 10px; }

/* ---------- cartas ---------- */
.card { --rc: var(--gold); position: relative; aspect-ratio: 5 / 7; width: 100%; max-width: 100%; border-radius: 13px; overflow: hidden;
  background: linear-gradient(165deg, #243F59 0%, #172C40 50%, #0F1F2E 100%);
  border: 1px solid var(--line-2); box-shadow: 0 18px 40px -18px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.06);
  display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 13% 9% 11%; text-align: center; }
.card::before { content: ""; position: absolute; inset: 6px; border: 1px solid color-mix(in srgb, var(--rc) 30%, transparent); border-radius: 9px; pointer-events: none; }
.card::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.07) 45%, transparent 60%); background-size: 250% 100%; background-position: 100% 0; transition: background-position 1.2s var(--ease); }
.card:hover::after { background-position: -50% 0; }
.card-ico { width: 50%; color: var(--rc); filter: drop-shadow(0 0 16px color-mix(in srgb, var(--rc) 35%, transparent)); }
.card-ico svg { display: block; width: 100%; height: auto; }
.card-name { font-family: var(--display); letter-spacing: .16em; text-transform: uppercase; font-size: clamp(12px, 3.6vw, 15px); }
.card-txt { font-size: 11.5px; color: var(--mute); line-height: 1.35; display: grid; gap: 4px; }
.card-txt b { color: var(--fg); font-weight: 500; }
.card.back { justify-content: center; background:
  repeating-linear-gradient(45deg, rgba(200,176,120,.045) 0 1px, transparent 1px 10px),
  repeating-linear-gradient(-45deg, rgba(200,176,120,.045) 0 1px, transparent 1px 10px),
  radial-gradient(70% 50% at 50% 50%, #22405C, #0F1E2C); }
.card.back img { width: 62%; opacity: .62; }
.card.dead { filter: grayscale(.9) brightness(.55); }
.card.dead .stamp { filter: none; }
.stamp { position: absolute; top: 42%; left: 50%; transform: translate(-50%,-50%) rotate(-14deg); border: 1.5px solid var(--bad); color: var(--bad);
  font-family: var(--display); letter-spacing: .22em; padding: 3px 12px 2px; font-size: 13px; text-transform: uppercase; border-radius: 5px; background: rgba(14,26,38,.7); }
.card.selectable { cursor: pointer; transition: transform .3s var(--ease), box-shadow .3s var(--ease); }
.card.selectable:active { transform: scale(.97); }
.card.sel { transform: translateY(-10px); box-shadow: 0 0 0 1.5px var(--gold), 0 24px 40px -16px rgba(200,176,120,.35); }
.card.sel::before { border-color: var(--gold); }
.mini { width: 26px; height: 36px; border-radius: 5px; overflow: hidden; display: grid; place-items: center; border: 1px solid var(--line-2);
  background: radial-gradient(80% 60% at 50% 50%, #22405C, #0F1E2C); }
.mini img { width: 80%; opacity: .5; }
.mini.dead { background: #142434; color: var(--rc); border-color: color-mix(in srgb, var(--rc) 40%, transparent); }
.mini.dead svg { width: 70%; opacity: .7; }

@keyframes flipIn { 0% { transform: perspective(700px) rotateY(95deg) scale(.94); filter: brightness(1.8); } 100% { transform: none; } }
@keyframes deal { from { opacity: 0; transform: translateY(60px) rotate(-8deg) scale(.88); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(16px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes coinUp { 0% { opacity: 0; transform: translate(-50%, 6px) scale(.8); } 18% { opacity: 1; transform: translate(-50%, -4px) scale(1.05); } 100% { opacity: 0; transform: translate(-50%, -30px); } }
@keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.28); color: var(--gold-2); } 100% { transform: scale(1); } }
@keyframes breathe { 0%,100% { box-shadow: 0 0 0 1px rgba(200,176,120,.38), 0 0 0 0 rgba(200,176,120,0); } 50% { box-shadow: 0 0 0 1px rgba(200,176,120,.7), 0 0 28px -6px rgba(200,176,120,.35); } }
@keyframes float { 0%,100% { transform: translateY(0) rotate(var(--r)); } 50% { transform: translateY(-7px) rotate(var(--r)); } }
@keyframes pulseDot { 0%,100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px) rotate(-1.5deg); } 40% { transform: translateX(6px) rotate(1deg); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
@keyframes stampIn { 0% { opacity: 0; transform: translate(-50%,-50%) rotate(-14deg) scale(2.2); } 60% { opacity: 1; transform: translate(-50%,-50%) rotate(-14deg) scale(.94); } 100% { opacity: 1; transform: translate(-50%,-50%) rotate(-14deg) scale(1); } }
@keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.fx-flip { animation: flipIn .75s var(--ease) both; }
.fx-deal { animation: deal .9s var(--ease) both; }
.fx-rise { animation: rise .7s var(--ease) both; }

/* ---------- home ---------- */
.home-hero { display: grid; justify-items: center; text-align: center; gap: 10px; padding-top: 18px; }
.home-hero .logo { width: 132px; opacity: .9; animation: rise .9s var(--ease) both; }
.home-hero h1 { font-family: var(--display); font-weight: 400; font-size: clamp(54px, 17vw, 96px); line-height: 1; letter-spacing: .08em; margin: 6px 0 0; padding-left: .08em; color: var(--fg);
  text-shadow: 0 10px 40px rgba(127,170,211,.25); animation: rise 1.1s .1s var(--ease) both; }
.home-hero .rule { width: 64px; height: 1px; background: var(--gold); transform-origin: center; animation: sweep 1s .5s var(--ease-io) both; }
.home-hero p { max-width: 32ch; color: var(--mute); margin: 4px 0 0; animation: rise 1s .35s var(--ease) both; }
.fan { --w: clamp(74px, 22vw, 104px); position: relative; height: calc(var(--w) * 1.4 + 34px); margin: 4px auto 0; width: 100%; cursor: pointer; }
.fan .fan-pos { position: absolute; top: 10px; left: calc(50% - var(--w) / 2 + var(--x) * var(--w) * .62); width: var(--w); transform: rotate(var(--rot)) translateY(var(--dy)); transform-origin: 50% 130%; }
.fan .slot { animation: deal 1s var(--ease) both; }
.fan .card { width: 100%; padding: 0; justify-content: center; animation: float 6s ease-in-out infinite; }
.fan .card .card-txt, .fan .card .card-name { display: none; }
.fan .card .card-ico { width: 56%; }
.panel { background: linear-gradient(180deg, rgba(27,47,66,.78), rgba(20,36,52,.78)); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: grid; gap: 14px;
  box-shadow: 0 30px 60px -30px rgba(0,0,0,.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.field { display: grid; gap: 7px; }
.field label { font-size: 12px; color: var(--mute); letter-spacing: .06em; }
.input { -webkit-appearance: none; appearance: none; min-width: 0; width: 100%; min-height: 52px; border-radius: 14px; border: 1px solid var(--line-2); background: rgba(9,17,25,.5); color: var(--fg); font: inherit; font-size: 16px; padding: 0 16px; transition: border-color .25s ease, background .25s ease; }
.input:focus { outline: none; border-color: var(--gold); background: rgba(9,17,25,.7); }
.input::placeholder { color: var(--faint); }
.input.code { font-family: var(--display); letter-spacing: .35em; text-transform: uppercase; text-align: center; font-size: 22px; padding: 0 8px 0 calc(8px + .35em); }
.or { display: flex; align-items: center; gap: 12px; color: var(--faint); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.join { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
.join .btn { width: auto; padding: 0 18px; }
.home-hero, .panel, .stage, .seat, .act, .target, .prow { min-width: 0; }
.notice { border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); background: color-mix(in srgb, var(--gold) 7%, transparent); color: var(--gold-2); border-radius: 14px; padding: 12px 14px; font-size: 14px; }

/* ---------- topo do jogo ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.top .brand b { font-family: var(--display); font-weight: 400; letter-spacing: .18em; font-size: 17px; }
.top .brand span { font-size: 12px; color: var(--mute); letter-spacing: .12em; white-space: nowrap; }
.top .brand span em { font-style: normal; color: var(--gold); font-family: var(--display); letter-spacing: .26em; }
.icons { display: flex; gap: 8px; }
.ibtn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--mute); transition: color .2s ease, border-color .2s ease; }
.ibtn:hover { color: var(--fg); border-color: var(--line-2); }
.ibtn svg { width: 19px; height: 19px; }

/* ---------- lobby ---------- */
.code-big { font-family: var(--display); font-size: clamp(40px, 13vw, 72px); letter-spacing: .24em; padding-left: .24em; white-space: nowrap; line-height: 1; text-align: center; color: var(--fg); }
.code-big span { display: inline-block; animation: rise .8s var(--ease) both; }
.plist { display: grid; gap: 8px; }
.prow { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: rgba(9,17,25,.35); border: 1px solid var(--line); animation: rise .6s var(--ease) both; }
.prow .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); border: 1px solid color-mix(in srgb, var(--gold) 40%, transparent); border-radius: 99px; padding: 1px 8px; margin-left: 8px; vertical-align: 2px; white-space: nowrap; }
.tag.you { color: var(--mute); border-color: var(--line-2); }
.avatar { width: 36px; height: 36px; flex: none; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 15px; color: #0E1A26; background: var(--av); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
.empty-seat { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; border: 1px dashed var(--line-2); color: var(--faint); font-size: 14px; }
.empty-seat .avatar { background: transparent; border: 1px dashed var(--line-2); box-shadow: none; }

/* ---------- mesa ---------- */
.seats { display: grid; gap: 8px; }
.seat { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: rgba(20,36,52,.6); border: 1px solid var(--line); transition: background .4s ease, opacity .4s ease; position: relative; }
.seat.turn { animation: breathe 2.6s ease-in-out infinite; background: rgba(35,59,83,.55); }
.seat.out { opacity: .5; }
.seat-mid { flex: 1; min-width: 0; }
.seat-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat-sub { font-size: 12px; color: var(--mute); min-height: 1.2em; }
.seat-sub.hot { color: var(--gold); }
.seat-cards { display: flex; gap: 5px; }
.coins { position: relative; display: flex; align-items: center; gap: 5px; color: var(--gold); font-weight: 500; font-size: 15px; min-width: 42px; justify-content: flex-end; }
.coins svg { width: 15px; height: 15px; }
.coins .num.pop { animation: pop .6s var(--ease); display: inline-block; }
.bubble { position: absolute; left: 50%; top: -14px; font-size: 13px; font-weight: 600; color: var(--gold-2); white-space: nowrap; pointer-events: none; animation: coinUp 1.5s var(--ease) both; }
.bubble.neg { color: var(--bad); }

/* palco do lance */
.stage { position: relative; text-align: center; padding: 22px 18px 20px; border-radius: 22px; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 0%, rgba(200,176,120,.09), transparent 60%), linear-gradient(180deg, rgba(27,47,66,.85), rgba(17,31,45,.85));
  border: 1px solid var(--line); display: grid; gap: 8px; justify-items: center; }
.stage::before { content: ""; position: absolute; left: 50%; top: 0; width: 46%; height: 1px; transform: translateX(-50%); background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: .7; }
.stage h2 { font-family: var(--display); font-weight: 400; font-size: clamp(24px, 7vw, 30px); line-height: 1.15; margin: 0; letter-spacing: .02em; text-wrap: balance; }
.stage .detail { color: var(--mute); max-width: 34ch; font-size: 14.5px; text-wrap: balance; }
.stage .role-pill { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 6px; border-radius: 99px; border: 1px solid color-mix(in srgb, var(--rc) 45%, transparent); background: color-mix(in srgb, var(--rc) 10%, transparent); font-size: 13px; }
.stage .role-pill i { width: 22px; height: 22px; color: var(--rc); display: grid; place-items: center; }
.stage .role-pill i svg { width: 100%; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 4px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--mute); background: rgba(9,17,25,.3); }
.chip .d { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); animation: pulseDot 1.4s ease-in-out infinite; }
.chip.done { color: var(--fg); border-color: var(--line-2); }
.chip.done .d { animation: none; background: var(--good); }
.chip.bad .d { background: var(--bad); }
.unstick { margin-top: 6px; font-size: 13px; color: var(--gold); border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); border-radius: 99px; padding: 6px 14px; }

/* sua mão */
.hand-head { display: flex; align-items: end; justify-content: space-between; }
.hand-head .coins { font-size: 26px; font-family: var(--display); gap: 8px; }
.hand-head .coins svg { width: 22px; height: 22px; }
.hand-head .coins small { font-family: var(--body); font-size: 12px; color: var(--mute); letter-spacing: .1em; margin-left: 2px; }
.hand { display: grid; grid-template-columns: repeat(2, minmax(0, 148px)); justify-content: center; gap: 14px; }
.hand-head { align-items: center; }
.hand .slot { min-width: 0; }

/* ações */
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.act { --rc: var(--line-2); text-align: left; padding: 12px 13px 11px; border-radius: 14px; border: 1px solid var(--line); background: rgba(20,36,52,.7); display: grid; gap: 3px; position: relative; overflow: hidden;
  transition: transform .18s var(--ease), border-color .25s ease, background .25s ease, opacity .25s ease; min-height: 78px; align-content: start; }
.act:hover:not(:disabled) { border-color: var(--line-2); }
.act:active:not(:disabled) { transform: scale(.97); }
.act:disabled { opacity: .32; }
.act .t { font-weight: 500; font-size: 15px; }
.act .d { font-size: 12px; color: var(--mute); line-height: 1.3; }
.act .who { display: flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--rc); margin-top: 3px; }
.act .who .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--rc); }
.act .have { margin-left: auto; color: var(--good); letter-spacing: .06em; text-transform: none; font-size: 11px; }
.act.role { border-color: color-mix(in srgb, var(--rc) 28%, transparent); background: linear-gradient(160deg, color-mix(in srgb, var(--rc) 9%, transparent), rgba(20,36,52,.7) 60%); }
.act.wide { grid-column: 1 / -1; }
.act.must { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.sect-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sect-title h3 { margin: 0; font-family: var(--display); font-weight: 400; letter-spacing: .14em; text-transform: uppercase; font-size: 13px; color: var(--mute); }
.targets { display: grid; gap: 8px; }
.target { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; border: 1px solid var(--line-2); background: rgba(20,36,52,.7); text-align: left; transition: transform .18s var(--ease), border-color .2s; }
.target:active { transform: scale(.98); }
.target .grow { flex: 1; min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pool { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding-top: 12px; }
.pool .card { padding: 16% 5% 12%; }
.pool .card .card-txt { display: none; }
.pool .card .card-name { font-size: clamp(7.5px, 2.2vw, 11px); letter-spacing: .06em; }
.card-name { max-width: 100%; overflow-wrap: anywhere; }
@media (max-width: 380px) {
  .hand { gap: 10px; }
  .card-txt { font-size: 10.5px; }
  .card-name { font-size: 11px; letter-spacing: .1em; }
  .seat { gap: 9px; padding: 9px 10px; }
  .seat .avatar { width: 32px; height: 32px; font-size: 13px; }
  .mini { width: 22px; height: 31px; }
  .actions { gap: 6px; }
  .act { padding: 10px 11px; min-height: 72px; }
  .act .t { font-size: 14px; }
  .stage { padding: 18px 14px; }
}
.pool .lbl { text-align: center; font-size: 11px; color: var(--faint); margin-top: 6px; letter-spacing: .08em; }
.waiting { text-align: center; color: var(--mute); font-size: 14px; padding: 8px 0; display: flex; align-items: center; justify-content: center; gap: 10px; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); animation: pulseDot 1.2s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }

/* histórico */
.log { display: grid; gap: 0; border-top: 1px solid var(--line); }
.log div { padding: 9px 2px; border-bottom: 1px solid var(--line); font-size: 13.5px; color: var(--mute); }
.log div:first-child { color: var(--fg); }

/* fim */
.winner { text-align: center; display: grid; gap: 10px; justify-items: center; padding: 26px 16px; }
.winner .crown { width: 54px; color: var(--gold); animation: rise .9s var(--ease) both; }
.winner h2 { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 11vw, 52px); margin: 0; line-height: 1.05; animation: rise 1s .15s var(--ease) both; text-wrap: balance; }
.winner .rule { width: 80px; height: 1px; background: var(--gold); animation: sweep 1s .4s var(--ease-io) both; }

/* ---------- momentos ---------- */
.moment { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; text-align: center;
  padding: calc(env(safe-area-inset-top,0px) + 24px) max(24px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(24px, env(safe-area-inset-left,0px));
  background: rgba(8,15,22,.84); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); animation: fade .35s ease both; cursor: pointer; }
.moment.out { animation: fade .35s ease reverse both; }
.moment .inner { display: grid; justify-items: center; gap: 14px; max-width: 340px; }
.moment .eyebrow { animation: rise .6s var(--ease) both; }
.moment h3 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 8vw, 34px); line-height: 1.15; margin: 0; animation: rise .7s .08s var(--ease) both; text-wrap: balance; }
.moment .res { font-size: 16px; color: var(--mute); animation: rise .7s 1.45s var(--ease) both; text-wrap: balance; }
.moment .res b { color: var(--fg); font-weight: 500; }
.m-card { width: 150px; perspective: 900px; animation: rise .8s .15s var(--ease) both; }
.m-flip { position: relative; transform-style: preserve-3d; transition: none; }
.m-flip .card { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.m-flip .card.face { position: absolute; inset: 0; transform: rotateY(180deg); }
.m-flip.go { animation: mflip 1s .75s var(--ease-io) both; }
@keyframes mflip { from { transform: rotateY(0); } to { transform: rotateY(180deg); } }
.m-flip.bluff { animation: shake .6s .8s ease both; }
.m-flip.bluff .stamp { animation: stampIn .5s 1.2s var(--spring) both; font-size: 17px; }
.moment.small { inset: auto 0 auto 0; top: 0; background: none; backdrop-filter: none; -webkit-backdrop-filter: none; pointer-events: none; padding-top: calc(env(safe-area-inset-top,0px) + 12px); }
.banner { display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 99px; background: rgba(27,47,66,.92); border: 1px solid var(--line-2);
  box-shadow: 0 20px 40px -18px rgba(0,0,0,.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 14.5px; animation: bannerIn .5s var(--spring) both; max-width: calc(100vw - 32px); }
.banner i { width: 18px; height: 18px; color: var(--rc, var(--gold)); display: grid; place-items: center; flex: none; }
.banner i svg { width: 100%; }
.moment.small.out .banner { animation: bannerOut .35s ease both; }
@keyframes bannerIn { from { opacity: 0; transform: translateY(-24px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes bannerOut { to { opacity: 0; transform: translateY(-16px); } }
.big-word { font-family: var(--display); font-size: clamp(54px, 18vw, 84px); letter-spacing: .1em; line-height: 1; animation: rise .9s .05s var(--ease) both; padding-left: .1em; }

/* ---------- regras ---------- */
.sheet { position: fixed; inset: 0; z-index: 50; background: rgba(8,15,22,.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); animation: fade .3s ease both; overflow-y: auto; overscroll-behavior: contain; }
.sheet .body { max-width: 480px; margin: 0 auto; background: linear-gradient(180deg, #19304A, #0F1E2C); border: 1px solid var(--line); border-bottom: 0; min-height: 100%;
  padding: calc(env(safe-area-inset-top,0px) + 22px) max(20px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) max(20px, env(safe-area-inset-left,0px));
  animation: rise .5s var(--ease) both; display: grid; gap: 18px; align-content: start; }
.sheet h2 { font-family: var(--display); font-weight: 400; font-size: 30px; margin: 0; letter-spacing: .04em; }
.sheet h4 { margin: 4px 0 0; font-family: var(--display); font-weight: 400; letter-spacing: .14em; text-transform: uppercase; font-size: 13px; color: var(--gold); }
.sheet p, .sheet li { color: var(--mute); margin: 0; max-width: 62ch; }
.sheet ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.sheet p b, .sheet li b { color: var(--fg); font-weight: 500; }
.rgrid { display: grid; gap: 10px; }
.rrow { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; padding: 10px; border-radius: 14px; border: 1px solid var(--line); background: rgba(9,17,25,.3); }
.rrow .card { padding: 14% 8%; justify-content: center; border-radius: 9px; }
.rrow .card .card-name, .rrow .card .card-txt { display: none; }
.rrow .card .card-ico { width: 64%; }
.rrow b { display: block; font-family: var(--display); font-weight: 400; letter-spacing: .12em; text-transform: uppercase; font-size: 14px; color: var(--fg); }
.rrow span { font-size: 13.5px; color: var(--mute); display: block; }

.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top,0px) + 14px); transform: translate(-50%, -20px); opacity: 0; z-index: 70; pointer-events: none;
  background: var(--fg); color: #0E1A26; font-weight: 500; font-size: 14px; padding: 11px 18px; border-radius: 99px; transition: opacity .3s ease, transform .4s var(--spring); max-width: calc(100vw - 40px); text-align: center; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

const ACT_ORDER = ["salario", "emprestimo", "captar", "tomar", "sabotar", "recrutar", "aquisicao"];

/* =================== regras puras (rodam sobre uma cópia do estado) =================== */
const P = (s, id) => s.players.find(p => p.id === id);
const alive = p => !!p && p.cards.some(c => !c.dead);
const liveIdx = p => p.cards.map((c, i) => c.dead ? -1 : i).filter(i => i >= 0);
const nick = (s, id) => (P(s, id) || {}).nick || "Alguém";
const newPid = () => Math.random().toString(36).slice(2, 10);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function log(s, m, ev) { s.logN = (s.logN || 0) + 1; s.log.push({ n: s.logN, m, ev: ev || null }); if (s.log.length > 50) s.log.splice(0, s.log.length - 50); }

function startGame(s) {
  s.deck = shuffle(ROLE_ORDER.flatMap(r => [r, r, r]));
  s.players.forEach(p => { p.cards = [{ r: s.deck.pop(), dead: false }, { r: s.deck.pop(), dead: false }]; p.coins = 2; });
  const first = s.players[Math.floor(Math.random() * s.players.length)];
  if (s.players.length === 2) first.coins = 1;
  s.turn = first.id; s.status = "play"; s.winner = null; s.log = []; s.resp = {}; s.round = (s.round || 0) + 1;
  log(s, `Cartas na mesa. ${first.nick} abre a partida.`, { t: "start" });
  s.phase = { k: "turn", pid: newPid() };
}
function endTurn(s) {
  if (s.status !== "play") return;
  const n = s.players.length, i = s.players.findIndex(p => p.id === s.turn);
  for (let k = 1; k <= n; k++) { const p = s.players[(i + k) % n]; if (alive(p)) { s.turn = p.id; break; } }
  s.phase = { k: "turn", pid: newPid() }; s.resp = {};
}
function checkWin(s) {
  const al = s.players.filter(alive);
  if (al.length === 1 && s.status === "play") {
    s.status = "over"; s.winner = al[0].id; s.phase = { k: "over", pid: newPid() }; s.resp = {};
    log(s, `${al[0].nick} venceu a partida.`, { t: "win", who: al[0].id });
  }
}
function kill(s, id, idx) {
  const p = P(s, id), c = p.cards[idx]; c.dead = true;
  log(s, `${p.nick} entregou ${ROLES[c.r].n}.`, { t: "lost", who: id, role: c.r });
  if (!alive(p)) log(s, `${p.nick} está fora.`, { t: "out", who: id });
  checkWin(s);
}
function lose(s, id, next) {
  const p = P(s, id), li = liveIdx(p);
  if (li.length === 0) return cont(s, next);
  if (li.length === 1) { kill(s, id, li[0]); return cont(s, next); }
  s.phase = { k: "lose", pid: newPid(), who: id, next }; s.resp = {};
}
function cont(s, next) {
  if (s.status !== "play") return;
  const act = next.act;
  if (next.k === "end") return endTurn(s);
  if (next.k === "perform") return perform(s, act);
  if (next.k === "blocked") { log(s, `${ACTS[act.type].l} de ${nick(s, act.actor)} foi bloqueado.`); return endTurn(s); }
  if (next.k === "blockOnly") {
    if (!alive(P(s, act.target))) return perform(s, act);
    s.phase = { k: "react", pid: newPid(), act, stage: "blockOnly" }; s.resp = {}; return;
  }
}
function perform(s, act) {
  const a = P(s, act.actor), t = act.target ? P(s, act.target) : null;
  if (!alive(a)) return endTurn(s);
  switch (act.type) {
    case "emprestimo": a.coins += 2; log(s, `${a.nick} pegou o Empréstimo: +2 M.`); return endTurn(s);

      o.blocks.map(r => h("button", { class: "btn btn-role", style: `--rc:${ROLES[r].hue}`, onclick: () => respond("block", r) }, h("span", { class: "dot" }), `Bloquear como ${ROLES[r].n}`, held.has(r) ? h("span", { style: "color:var(--good);font-size:12px" }, "na mão") : null)),
      h("button", { class: "btn btn-primary", onclick: () => respond("pass") }, "Deixar passar"));
  }
  if (ph.k === "lose") {
    if (ph.who !== myId) return waitTxt(`Esperando ${nick(s, ph.who)} escolher`);
    const sel = ui.loseSel != null && me.cards[ui.loseSel] && !me.cards[ui.loseSel].dead ? ui.loseSel : null;
    return h("div", { class: "btn-row" },
      h("button", { class: "btn btn-bad", disabled: sel == null || ui.busy, onclick: () => act(x => chooseLose(x, myId, sel)) }, sel == null ? "Toque na carta que vai entregar" : `Entregar ${ROLES[me.cards[sel].r].n}`));
  }
  if (ph.k === "exchange") {
    if (ph.who !== myId) return waitTxt(`Esperando ${nick(s, ph.who)} recrutar`);
    const slots = liveIdx(me), pool = slots.map(i => me.cards[i].r).concat(ph.drawn), need = slots.length;
    const sel = ui.exSel.filter(i => i < pool.length);
    return h("div", { class: "btn-row fx-rise" },
      h("div", { class: "sect-title" }, h("h3", null, `Fique com ${need} carta${need > 1 ? "s" : ""}`), h("span", { class: "mute num", style: "font-size:13px" }, `${sel.length} de ${need}`)),
      h("div", { class: "pool" }, pool.map((r, i) => h("div", null,
        cardEl(r, { selectable: true, sel: sel.includes(i), onclick: () => {
          const at = ui.exSel.indexOf(i);
          if (at >= 0) ui.exSel.splice(at, 1); else { if (ui.exSel.length >= need) ui.exSel.shift(); ui.exSel.push(i); }

        } }),
        h("div", { class: "lbl" }, i < slots.length ? "sua" : "nova")))),
      h("button", { class: "btn btn-primary", disabled: sel.length !== need || ui.busy, onclick: () => act(x => chooseExchange(x, myId, sel)) }, "Ficar com estas"));
  }
  return h("div");
}
function winnerView(s) {

    h("div", { class: "crown", html: SVG.crown }),

    isHost ? h("div", { class: "btn-row", style: "width:100%;margin-top:8px" },
      h("button", { class: "btn btn-primary", disabled: ui.busy, onclick: () => act(x => { if (x.players.length < 2) return "Precisa de 2 jogadores."; startGame(x); }) }, "Jogar de novo"),
      h("button", { class: "btn btn-ghost", disabled: ui.busy, onclick: () => act(x => { x.status = "lobby"; x.phase = { k: "lobby", pid: newPid() }; x.resp = {}; x.players.forEach(p => { p.cards = []; p.coins = 0; }); }) }, "Abrir a mesa para mais gente"))
      : h("div", { class: "waiting" }, h("span", { class: "dots" }, h("i"), h("i"), h("i")), `${nick(s, s.host)} decide a próxima`));
}
function rulesView() {
  const close = () => { ui.rules = false; render(); };
  return h("div", { class: "sheet", onclick: e => { if (e.target.classList.contains("sheet")) close(); } },
    h("div", { class: "body" },
      h("div", { class: "top" }, h("div", { class: "eyebrow" }, "Manual da mesa"), h("button", { class: "ibtn", "aria-label": "Fechar", onclick: close, html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>' })),
      h("h2", null, "Como jogar"),
      h("p", null, "Ganha quem ficar por último com carta na mão. Cada um começa com ", h("b", null, "2 cartas secretas"), " e ", h("b", null, "2 M"), ". Com 2 jogadores, quem abre começa com 1 M."),
      h("p", null, "Na sua vez, faça uma ação. Você pode dizer que é ", h("b", null, "qualquer cargo"), ", tendo a carta ou não. O baralho tem 3 cartas de cada cargo."),
      h("h4", null, "Os cinco cargos"),
      h("div", { class: "rgrid" }, ROLE_ORDER.map(r => h("div", { class: "rrow" }, cardEl(r), h("div", null, h("b", null, ROLES[r].n), ROLES[r].a ? h("span", null, ROLES[r].a) : null, ROLES[r].b ? h("span", null, ROLES[r].b) : null)))),
      h("h4", null, "Ações de qualquer um"),
      h("ul", null,
        h("li", null, h("b", null, "Salário:"), " +1 M. Ninguém bloqueia."),
        h("li", null, h("b", null, "Empréstimo:"), " +2 M. Qualquer um pode bloquear dizendo ser Banqueiro."),
        h("li", null, h("b", null, "Aquisição hostil:"), " paga 7 M e o alvo perde uma carta. Ninguém bloqueia. Com 10 M ou mais, ela é obrigatória.")),
      h("h4", null, "Duvidar"),
      h("p", null, "Quando alguém diz ser um cargo (na ação ou no bloqueio), qualquer um pode duvidar. Se a pessoa tinha a carta, ela mostra, troca por outra do baralho e ", h("b", null, "quem duvidou perde uma carta"), ". Se blefou, ", h("b", null, "ela perde uma carta"), " e a jogada não acontece."),
      h("h4", null, "Bloquear"),
      h("p", null, "Quem é alvo de Tomar pode bloquear como Tubarão ou Headhunter. Quem é alvo de Sabotar pode bloquear como Jurídico. O bloqueio também é uma declaração, então pode ser duvidado."),
      h("h4", null, "Detalhes"),

        h("li", null, "Quem perde uma carta escolhe qual revelar. Sem cartas, está fora."),
        h("li", null, "Os 3 M do Sabotar são pagos na hora. Voltam só se provarem que você blefou."),
        h("li", null, "Mesmo depois de uma dúvida que não colou, o alvo ainda pode bloquear."),
        h("li", null, "Se alguém sumir, o anfitrião pode destravar a mesa depois de 30 segundos.")),
      h("button", { class: "btn btn-primary", onclick: close }, "Bora jogar")));

/* =================== ações do jogador =================== */
function go(type, target) { ui.pick = null; act(x => declare(x, myId, type, target)); }
async function respond(r, role) {
  const ph = state.phase;
  ui.sent = { pid: ph.pid, r, role: role || null, t: Date.now() };
  sfx("tap"); render();
  try { await gameRef.update({ resp: { [myId]: ui.sent } }); }
  catch (e) { ui.sent = null; toast(errMsg(e)); render(); }
}
function envProblem() {
  if (env === "ok") return null;
  if (env === "loading") return "Ainda conectando ao jogo. Espere 2 segundos e toque de novo.";
  if (env === "noid") return "Entre na sua conta do Claude para jogar.";
  return "Aqui o modo online não funciona. Abra o link no Safari ou no Chrome, logado na sua conta do Claude.";
}
function nickOk() {
  const ep = envProblem(); if (ep) { toast(ep); return null; }
  const n = (ui.nick || "").trim();
  if (n.length < 2) { toast("Escreva um apelido com pelo menos 2 letras."); const el = document.getElementById("nick"); el && el.focus(); return null; }
  return n.slice(0, 16);
}
async function createTable() {
  const n = nickOk(); if (!n) return;
  ui.busy = true; render();
  const L = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  try {
    for (let i = 0; i < 6; i++) {
      const c = Array.from({ length: 4 }, () => L[Math.floor(Math.random() * L.length)]).join("");
      const ref = db.doc("mesas/" + c);
      const ex = await ref.get();
      if (ex.exists && Date.now() - (ex.data().at || 0) < 12 * 3600e3) continue;
      await ref.set({ v: 1, at: Date.now(), code: c, host: myId, status: "lobby", round: 0, players: [{ id: myId, nick: n, coins: 0, cards: [] }], deck: [], turn: null, phase: { k: "lobby", pid: newPid() }, resp: {}, log: [], logN: 0, winner: null });
      ui.busy = false; watch(c); return;
    }
    toast("Não deu para criar a mesa. Tente de novo.");
  } catch (e) { toast(errMsg(e)); }
  ui.busy = false; render();
}
async function joinTable(c) {
  c = (c || "").toUpperCase().replace(/[^A-Z]/g, "");
  const n = nickOk(); if (!n) return;
  if (c.length !== 4) { toast("O código tem 4 letras."); const el = document.getElementById("codein"); el && el.focus(); return; }
  ui.busy = true; render();
  let snap;
  try { snap = await db.doc("mesas/" + c).get(); } catch (e) { ui.busy = false; toast(errMsg(e)); render(); return; }
  ui.busy = false;
  if (!snap.exists) { toast("Mesa não encontrada. Confira o código."); render(); return; }
  const d = snap.data(), inIt = d.players.some(p => p.id === myId);
  if (!inIt && d.status === "lobby" && d.players.length >= 6) { toast("Mesa cheia: já tem 6 jogadores."); render(); return; }
  watch(c);
  if (!inIt && d.status !== "lobby") { toast("A partida já começou. Você vai assistir."); return; }
  await act(x => {
    const me = P(x, myId);
    if (me) { if (x.status === "lobby" && me.nick !== n) { me.nick = n; return; } return "noop"; }
    if (x.status !== "lobby") return "A partida já começou.";
    if (x.players.length >= 6) return "Mesa cheia.";
    x.players.push({ id: myId, nick: n, coins: 0, cards: [] });
  });
}
async function leaveLobby() {
  if (state && state.status === "lobby" && P(state, myId)) {
    await commit(x => {
      x.players = x.players.filter(p => p.id !== myId);
      if (x.host === myId && x.players[0]) x.host = x.players[0].id;
    }, true);
  }
  leaveLocal();
}

/* =================== início =================== */
let lastUnstick = false;
setInterval(() => { if (state && state.status === "play") { const u = canUnstick(state); if (u !== lastUnstick) { lastUnstick = u; render(); } } }, 3000);
document.addEventListener("keydown", e => { if (e.key === "Escape" && ui.rules) { ui.rules = false; render(); } });

async function boot() {
  render();
  const cl = window.claude;
  if (!cl || !cl.use) { env = "offline"; render(); return; }
  [db, user] = await Promise.all([cl.use("db"), cl.use("user")]);
  if (!db || !user) { env = "offline"; render(); return; }
  myId = await user.id();
  if (!myId) { env = "noid"; render(); return; }
  try { canWrite = await user.can("data.write"); } catch (e) { canWrite = null; }
  env = "ok";
  const saved = store.get("blefe.mesa", null);
  if (saved && /^[A-Z]{4}$/.test(saved)) watch(saved); else render();
}
boot();
